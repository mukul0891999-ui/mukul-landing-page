<title>Mukul | Telegram Channel</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background-color: #030303;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    overflow: hidden;
    position: relative;
}

/* BACKGROUND GRID */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 38px 38px;
    z-index: 0;
}

/* MAIN CONTAINER */

.container {
    width: 100%;
    max-width: 525px;
    min-height: 100svh;
    background: radial-gradient(
      ellipse at top,
      #101000 0%,
      #080900 55%,
      #050505 100%
    );
    padding: clamp(16px, 4vh, 38px) 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
}

/* PROFILE IMAGE */

.profile {
    width: clamp(112px, 21vh, 175px);
    height: clamp(112px, 21vh, 175px);
    border-radius: 50%;
    border: 5px solid #caff00;
    box-shadow: 0 0 28px rgba(202,255,0,0.35);
    overflow: hidden;
    flex-shrink: 0;
}

.profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* NAME */

.name {
    color: #ffc900;
    font-size: clamp(29px, 8vw, 43px);
    font-weight: 900;
    text-align: center;
    letter-spacing: 0.5px;
    margin-top: 10px;
}

.member {
    color: #ffcc00;
    font-size: clamp(17px, 4.5vw, 23px);
    margin-top: 12px;
    font-weight: 600;
    text-align: center;
}

/* BADGES */

.badges {
    display: flex;
    gap: 14px;
    margin-top: 12px;
    width: 100%;
    justify-content: center;
}

.badge {
    border: 1px solid #ffcc00;
    color: #ffcc00;
    border-radius: 30px;
    padding: 10px 17px;
    font-size: clamp(12px, 3.3vw, 15px);
    font-weight: 700;
    white-space: nowrap;
}

.badge.live {
    border-color: #ff3500;
    color: #ff3500;
}

/* STATISTICS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
    margin-top: 10px;
}

.stat-card {
    background: #101010;
    border: 1px solid #282828;
    border-radius: 16px;
    min-width: 0;
    padding: 20px 4px;
    text-align: center;
}

.stat-card:nth-child(2) {
    border-color: #772020;
}

.stat-card h2 {
    color: #ffcc00;
    font-size: clamp(19px, 5.5vw, 25px);
    font-weight: 900;
    white-space: nowrap;
}

.stat-card:nth-child(2) h2 {
    color: #ff3d48;
}

.stat-card p {
    color: #999;
    font-size: clamp(11px, 3vw, 14px);
    margin-top: 13px;
}

/* TELEGRAM BUTTON */

.telegram-btn {
    width: 100%;
    min-height: 78px;
    border-radius: 19px;
    background: linear-gradient(
        110deg,
        #288a35,
        #a43c2e,
        #d21d24
    );
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: white;
    text-decoration: none;
    font-size: clamp(19px, 5.2vw, 26px);
    font-weight: 900;
    text-align: center;
    margin-top: 8px;
    transition: 0.3s;
    box-shadow: 0 5px 22px rgba(0,0,0,0.25);
    animation: pulse 2s infinite;
}

.telegram-btn:active {
    transform: scale(0.97);
}

.telegram-icon {
    width: 27px;
    height: 27px;
    fill: white;
    flex-shrink: 0;
}

/* TRUST SECTION */

.trust {
    width: 100%;
    border: 1px solid #383838;
    border-radius: 23px;
    padding: 22px 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    text-align: center;
    margin-top: 5px;
}

.trust-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.trust-item .icon {
    font-size: 31px;
    font-weight: bold;
}

.green { color: #32d34a; }
.yellow { color: #ffcc00; }
.red { color: #ff3b43; }

.trust-item p {
    color: #aaa;
    font-size: clamp(10px, 3vw, 13px);
}

/* BUTTON ANIMATION */

@keyframes pulse {
    0% {
        box-shadow: 0 0 0 0 rgba(255,255,255,0.15);
    }
    70% {
        box-shadow: 0 0 0 9px rgba(255,255,255,0);
    }
    100% {
        box-shadow: 0 0 0 0 rgba(255,255,255,0);
    }
}

/* SMALL MOBILE SCREENS */

@media (max-height: 740px) {
    .container {
        padding-top: 10px;
        padding-bottom: 10px;
    }

    .profile {
        width: 105px;
        height: 105px;
        border-width: 4px;
    }

    .name {
        margin-top: 4px;
        font-size: 29px;
    }

    .member {
        margin-top: 5px;
        font-size: 17px;
    }

    .badges {
        margin-top: 5px;
    }

    .badge {
        padding: 8px 12px;
    }

    .stat-card {
        padding: 13px 3px;
    }

    .stat-card p {
        margin-top: 7px;
    }

    .telegram-btn {
        min-height: 65px;
        font-size: 19px;
    }

    .trust {
        padding: 14px 5px;
    }

    .trust-item {
        gap: 7px;
    }

    .trust-item .icon {
        font-size: 25px;
    }
}

/* EXTRA SMALL WIDTH */

@media (max-width: 350px) {
    .container {
        padding-left: 14px;
        padding-right: 14px;
    }

    .badges {
        gap: 7px;
    }

    .badge {
        padding: 8px 10px;
    }

    .stats {
        gap: 7px;
    }
}

</style>
</head>
